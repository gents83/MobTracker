# ==========================================
# MobTracker CI/CD Build and Deploy Pipeline
# ==========================================
# Automated multi-platform build, sign, and deployment pipeline.
# Supported Platforms: Web (GitHub Pages), Android (APK/AAB), iOS (ZIP project)

name: Build and Deploy (Web & Native Mobile)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Correct and standard global permissions for GitHub Pages and Releases.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-web-and-native:
    name: Build Web & Mobile Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript & Linting Checks
        run: npm run lint

      - name: Run Automated Unit Tests
        run: npm run test

      # --- GitHub Pages Configuration & Deployment Setup ---
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Compile and Build Web Assets for GitHub Pages
        run: |
          npm run build
          cp -r dist/ dist-pages/
          touch dist-pages/.nojekyll
          cp dist-pages/index.html dist-pages/404.html
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages Web Artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages/
          include-hidden-files: true

      # --- Mobile Application Compilation ---
      - name: Compile and Build Web Assets for Mobile
        run: npm run build

      - name: Sync Capacitor Native Platforms
        run: npx cap sync

      # --- Native Android Release Compilation ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Android SDK Environment
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Set up and Mask Android Signing Credentials
        id: sign_creds
        env:
          RAW_STORE_PWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RAW_KEY_AL: ${{ secrets.ANDROID_KEY_ALIAS }}
          RAW_KEY_PWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          STORE_PWD="$RAW_STORE_PWD"
          if [ -z "$STORE_PWD" ]; then
            STORE_PWD="mobtrack123"
          fi
          KEY_AL="$RAW_KEY_AL"
          if [ -z "$KEY_AL" ]; then
            KEY_AL="mobtrack-alias"
          fi
          KEY_PWD="$RAW_KEY_PWD"
          if [ -z "$KEY_PWD" ]; then
            KEY_PWD="mobtrack123"
          fi

          # Register values with GHA masking runner to redact them in execution logs
          echo "::add-mask::$STORE_PWD"
          echo "::add-mask::$KEY_AL"
          echo "::add-mask::$KEY_PWD"

          # Expose as environment variables for subsequent steps
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PWD" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=$KEY_AL" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=$KEY_PWD" >> $GITHUB_ENV

      - name: Build Android Signed Release APK & AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobtracker-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobtracker-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # --- Native iOS Structure ZIP synthesis ---
      - name: Zip iOS Xcode Workspace Structure
        run: zip -r mobtracker-ios-project.zip ios/App

      - name: Upload iOS Project Structure Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobtracker-ios-project
          path: mobtracker-ios-project.zip

      # --- Automated GitHub Releases & Artifacts Tagging ---
      - name: Extract Version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body: |
            MobTracker Release v${{ steps.get_version.outputs.VERSION }}.

            This release includes:
            * Store-ready signed Android APK (`app-release.apk`)
            * Google Play Store-ready Android App Bundle (`app-release.aab`)
            * iOS App workspace and project structure (`mobtracker-ios-project.zip`)

            You can also access the Web App directly on GitHub Pages!
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            mobtracker-ios-project.zip

  deploy-pages:
    name: Deploy Web App to GitHub Pages
    needs: build-web-and-native
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
