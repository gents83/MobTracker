name: Build and Deploy (Web & Native Mobile)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and uploading artifacts
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-web-and-native:
    name: Build Web & Mobile Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript/Lint Checks
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Compile and Build Web Assets
        run: npm run build

      - name: Sync Capacitor Native Platforms
        run: npx cap sync

      # --- Android Build ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK & AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'mobtrack123' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'mobtrack-alias' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'mobtrack123' }}

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobtracker-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobtracker-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # --- iOS Build Synthesis Verification ---
      - name: Upload iOS Project Structure
        uses: actions/upload-artifact@v4
        with:
          name: mobtracker-ios-project
          path: ios/App

      # --- GitHub Pages Deployment Upload ---
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-pages:
    name: Deploy Web App to GitHub Pages
    needs: build-web-and-native
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
