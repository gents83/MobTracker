name: Build and Deploy (Web & Native Mobile)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages, creating releases, and uploading artifacts
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-web-and-native:
    name: Build Web & Mobile Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript/Lint Checks
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Compile and Build Web Assets for Mobile
        run: npm run build

      - name: Sync Capacitor Native Platforms
        run: npx cap sync

      - name: Compile and Build Web Assets for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # --- Android Build ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK & AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'mobtrack123' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'mobtrack-alias' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'mobtrack123' }}

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobtracker-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Android Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobtracker-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      # --- iOS Build Synthesis Verification ---
      - name: Upload iOS Project Structure
        uses: actions/upload-artifact@v4
        with:
          name: mobtracker-ios-project
          path: ios/App

      - name: Get Version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Zip iOS Project Structure
        run: zip -r mobtracker-ios-project.zip ios/App

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body: |
            MobTracker first release (v${{ steps.get_version.outputs.VERSION }}).

            This release includes:
            * Store-ready signed Android APK (`app-release.apk`)
            * Google Play Store-ready Android App Bundle (`app-release.aab`)
            * iOS App workspace and project structure (`mobtracker-ios-project.zip`)

            You can also access the Web App directly on GitHub Pages!
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            mobtracker-ios-project.zip

      # --- GitHub Pages Deployment Upload ---
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Upload Pages Web Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: dist/

  deploy-pages:
    name: Deploy Web App to GitHub Pages
    needs: build-web-and-native
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
